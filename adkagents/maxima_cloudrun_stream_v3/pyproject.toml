[project]
name = "maxima_cloudrun_stream_v3"
version = "0.1.0"

description = "Cloud Run streaming canary deployment of the Maxima ADK agent."
authors = [
    {name = "CEOsystem", email = "engineering@example.com"},
]
dependencies = [
    "google-adk>=2.0.0,<3.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.130.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "protobuf>=6.31.1,<7.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "pytest>=8.3.4,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."

[tool.agents-cli]
name = "maxima-cloudrun-stream"
description = "Cloud Run streaming canary deployment of Maxima."
base_template = "adk"
agent_directory = "app"
region = "us-central1"
generated_at = "2026-06-09T00:00:00+00:00"
acli_version = "0.2.0"

[tool.agents-cli.create_params]
deployment_target = "cloud_run"
session_type = "agent_platform_sessions"
cicd_runner = "skip"
include_data_ingestion = false
datastore = "none"
